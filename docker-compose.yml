services:
  redis:
    image: redis:latest
    container_name: shop-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  bff:
    build:
      context: .
      dockerfile: bff/Dockerfile
    ports:
      - "8080:8080"
    environment:
      GRPC_NOTIFICATION_ADDRESS: notification:50051
    depends_on:
      - notification

  notification:
    build:
      context: .
      dockerfile: notification/Dockerfile
    ports:
      - "50051:50051"
    environment:
      REDIS_ADDRESS: redis:6379
    depends_on:
      - redis

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      REDIS_ADDRESS: redis:6379
    depends_on:
      - redis

volumes:
  redis_data: