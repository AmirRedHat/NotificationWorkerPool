services:
  redis:
    image: redis:latest
    container_name: shop-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  bff:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: bff
    ports:
      - "8080:8080"
    environment:
      HTTP_PORT: "8080"
      GRPC_NOTIFICATION_ADDRESS: notification:50051
    depends_on:
      - notification

  notification:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: notification_grpc
    ports:
      - "50051:50051"
    environment:
      REDIS_ADDRESS: redis:6379
    depends_on:
      - redis

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: worker
    environment:
      REDIS_ADDRESS: redis:6379
    depends_on:
      - notification

volumes:
  redis_data: